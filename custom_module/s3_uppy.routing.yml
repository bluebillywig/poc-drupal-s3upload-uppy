s3_uppy.upload_form:
  path: '/s3-video-upload'
  defaults:
    _form: '\Drupal\s3_uppy\Form\S3VideoUploadForm'
    _title: 'Upload Video to S3'
  requirements:
    _permission: 'upload videos to s3'

s3_uppy.generate_presigned_url:
  path: '/s3-uppy/generate-url'
  defaults:
    _controller: '\Drupal\s3_uppy\Controller\S3UploadController::generatePresignedUrl'
  requirements:
    _permission: 'upload videos to s3'
    _method: 'POST'

s3_uppy.upload_complete:
  path: '/s3-uppy/upload-complete'
  defaults:
    _controller: '\Drupal\s3_uppy\Controller\S3UploadController::uploadComplete'
  requirements:
    _permission: 'upload videos to s3'
    _method: 'POST'

s3_uppy.generate_upload_identifier:
  path: '/s3-uppy/generate-upload-identifier'
  defaults:
    _controller: '\Drupal\s3_uppy\Controller\S3UploadController::generateUploadIdentifier'
  requirements:
    _permission: 'upload videos to s3'
    _method: 'POST'

s3_uppy.get_embed_code:
  path: '/s3-uppy/get-embed-code'
  defaults:
    _controller: '\Drupal\s3_uppy\Controller\S3UploadController::getEmbedCode'
  requirements:
    _permission: 'upload videos to s3'
    _method: 'POST'

s3_uppy.media_preview:
  path: '/s3-uppy/preview/{media}'
  defaults:
    _controller: '\Drupal\s3_uppy\Controller\MediaViewController::view'
    _title: 'Video Preview'
  requirements:
    _permission: 'upload videos to s3'
    media: \d+

s3_uppy.settings:
  path: '/admin/config/media/s3-uppy'
  defaults:
    _form: '\Drupal\s3_uppy\Form\S3UppySettingsForm'
    _title: 'S3 Uppy Settings'
  requirements:
    _permission: 'administer site configuration'
