s3_uppy.settings:
  type: config_object
  label: 'S3 Uppy Settings'
  mapping:
    aws_access_key_id:
      type: string
      label: 'AWS Access Key ID'
    aws_secret_access_key:
      type: string
      label: 'AWS Secret Access Key'
    aws_s3_bucket:
      type: string
      label: 'AWS S3 Bucket'
    aws_s3_region:
      type: string
      label: 'AWS S3 Region'
    aws_s3_upload_prefix:
      type: string
      label: 'AWS S3 Upload Prefix'
    aws_s3_endpoint:
      type: string
      label: 'AWS S3 Endpoint'
    bb_publication:
      type: string
      label: 'Blue Billywig Publication Name'
    bb_api_secret:
      type: string
      label: 'Blue Billywig API Secret'
